name: フロント公開 (GitHub Pages)

# frontend/ を静的エクスポートして GitHub Pages に自動デプロイする。
# main への push（frontend 配下の変更）と、手動実行、そして巡回の完了に対応。

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
  # 巡回が live.generated.json を更新しても、その push は GITHUB_TOKEN によるものなので
  # GitHub は上の push トリガーを発火させない（ワークフローの無限ループ防止の仕様）。
  # そのため巡回結果がサイトに反映されないままだった。workflow_run で拾い直す。
  workflow_run:
    workflows: ["Bean Tracker 巡回"]
    types: [completed]

# Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write
  # 詰まった配信を見つけるために、github-pages 環境の履歴を読む
  deployments: read

# 同時実行は1本に（進行中はキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 巡回きっかけの場合、失敗した巡回では公開しない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: frontend
    steps:
      # workflow_run で来たときも、巡回がコミットした最新の main を取る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 公開の設定をログに残す。
      #
      # 08-06 に見えたもの:
      #   {"status":"errored","build_type":"workflow","source":{"branch":"main","path":"/docs"}}
      # ブランチ公開の設定（main の /docs）が残っていて、push のたびに
      # GitHub 側の "pages build and deployment" が docs/ をそのまま公開しに来ていた。
      # docs/ には .md しか無く index.html が無いので File not found になる。
      # さらにこちらの配信と数秒差で競合し、両方が順番待ちのまま10分で諦めていた。
      #
      # docs/ は documents/ に改名して、ブランチ公開が拾える中身を無くした。
      # 設定そのもの（Source を GitHub Actions にする）は GITHUB_TOKEN では変えられない
      # ため（administration 権限が要る／PUT は 403）、状態を見えるようにしておく。
      - name: 公開の設定を確かめる
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 || true

      # Pages を自動で有効化し、配信先の base_path（例: /bean-tracker）を取得
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 配信先を表示
        run: echo "base_path=${{ steps.pages.outputs.base_path }} origin=${{ steps.pages.outputs.origin }}"

      - name: 依存インストール
        run: npm ci

      - name: 静的ビルド（out/ を生成）
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # プッシュ通知の公開鍵。公開してよい鍵なので secrets ではなく変数で渡す。
          # 未設定のときは通知の欄が「配信設定がまだ」と出るだけで、他は変わらない
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Jekyll 無効化（_next を配信させる）
        run: touch out/.nojekyll

      - name: 成果物アップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # 中身は scripts/unstick-pages-deploy.sh に書いてある（なぜ要るのかも）
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/unstick-pages-deploy.sh
          sparse-checkout-cone-mode: false

      - name: 詰まっている配信を取り消す
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/unstick-pages-deploy.sh 20

      - name: Pages へデプロイ
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # 既定は10分。正常なら配信は1分もかからないので、そこまで待つ意味がない。
          # Pages が受け付けない状態だと、巡回のたびに10分ぶん待って赤くなる。
          # 5分あれば遅い日でも足りる。
          timeout: 300000

      - name: 前の配信を片付けてから待つ
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/unstick-pages-deploy.sh 60

      # やり直しが効くのは、配信が数秒で弾かれた場合だけ
      # （前の配信と重なった 400 など）。
      #
      # 時間切れで諦めた場合には効かない。deploy-pages は諦めるときに自分の配信を
      # 取り消すが、Pages の配信IDはコミットの sha そのものなので、同じ sha で
      # 作り直しても「すでに取り消し済み」の扱いになり、即 Deployment cancelled で
      # 返ってくる（実測: 08-06 13:35 の 9a835c02）。
      #
      # その場合を条件で外そうとしたが、できなかった。continue-on-error を付けた
      # 手順は、中で失敗しても conclusion が success になる（失敗は outcome にしか
      # 出ない）ため、時間切れかどうかを条件式から見分けられない。
      # 効かないときも6秒で終わるので、そのまま毎回試す。
      - name: Pages へデプロイ（やり直し）
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # 実際に開けるかを外から確かめる。ここが唯一、公開後のサイトに触れる場所。
      # 配信直後は CDN が追いつかないことがあるので、少し間を空けて数回試す。
      # 配信が失敗していても確かめる。前の中身がまだ生きているかどうかは別の話で、
      # 「公開は落ちたがサイトは開ける」と「サイトごと死んでいる」は区別したい。
      - name: 開けるか確かめる
        id: reach
        if: always()
        continue-on-error: true
        env:
          URL: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || 'https://yutohu-hub.github.io/bean-tracker/' }}
        run: |
          echo "確認先: $URL"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' -L "$URL" || echo 000)
            echo "$i 回目: HTTP $code"
            if [ "$code" = "200" ] && grep -q "BEAN TRACKER" /tmp/page.html; then
              echo "開けました"
              exit 0
            fi
            sleep 20
          done
          echo "── 返ってきた中身の先頭 ──"
          head -c 800 /tmp/page.html || true
          echo
          echo "サイトが開けません"
          exit 1

      # 配信が進まないときに、次に何を見ればいいかをログに残す。
      # ここが無いと「deployment_queued が並んで終わり」で手がかりが消える。
      # always() が要る。条件式に always()/failure() を書かないと success() が
      # 暗黙で and される。ここまでに「やり直し」が落ちていると job は失敗扱いなので、
      # steps.reach.outcome だけ見ても手順ごと飛ばされる（実測: 08-06 13:54 は skipped）。
      - name: 開けないときの手がかり
        if: always() && steps.reach.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "── Pages の状態 ──"
          gh api "repos/$GITHUB_REPOSITORY/pages" || true
          cat <<'MSG'

          読み方:
            "status": "built"    … 正常。配信が届いている
            "status": "errored"  … Pages 側が受け付けていない
            "build_type"         … "workflow" ならこのワークフローが公開元
            "source"             … ブランチ公開の名残。build_type が workflow なら本来無視される

          配信が deployment_queued のまま10分続いた場合、順番待ちの相手はいない
          （その前の手順で確かめている）。Pages 側が配信を拾っていない状態で、
          リポジトリからは直せない。

          Settings → Pages → Build and deployment → Source を
          「GitHub Actions」で保存し直してください。ここを保存すると Pages の
          設定が作り直され、errored から復帰します。
          この変更は GITHUB_TOKEN では行えません（PUT /repos/../pages は 403）。
          MSG
          exit 1
