name: 価格の生データ調査

# 取り込んだ価格が実売の1/100になっている店があり、原因の切り分けに
# 店の生レスポンスが要る。開発環境からは店に到達できないため、
# ネットワークのある runner で走らせて中身を出すだけのワークフロー。
# 読むだけで、コミットもデプロイもしない。

on:
  workflow_dispatch:
    inputs:
      shops:
        description: "調べる店のURL（空白区切り）。空なら既定の6店"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: pip install httpx pyyaml
      - name: 生データを出力
        run: python scripts/diag_price.py ${{ github.event.inputs.shops }}
