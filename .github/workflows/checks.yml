name: 点検

# 変更するたびに、壊れていないかを機械に見てもらう。
#
# tests/ には前から2本テストがあったが、動かす場所がどこにも無く、
# 手で `python tests/test_push_notify.py` と打つ以外に走る機会が無かった。
# 走らないテストは、通っているのか壊れているのか誰も知らない状態で腐る。
# ここで毎回走らせる。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python（巡回まわり）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存インストール
        run: |
          pip install -r requirements.txt
          pip install pyflakes

      # 使っていない import や未定義の名前を拾う。型検査まではしない
      - name: 静的チェック
        run: python -m pyflakes main.py src/*.py scripts/*.py tests/*.py

      - name: テスト
        run: |
          python tests/test_push_notify.py
          python tests/test_generic_adapter.py
          python tests/test_build_prices.py
          python tests/test_looks_like_coffee.py
          python tests/test_origin.py
          python tests/test_bean_evidence.py
          python tests/test_withdrawn.py
          python tests/test_bean_id.py

      # ネットに出ずに一巡できるかを見る。ECの仕様変更とは無関係に、
      # 差分検知と書き出しの配線が生きているかの確認
      - name: 手元のデータで一巡
        run: python main.py --mock fixtures

  frontend:
    name: フロント（Next.js）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存インストール
        run: npm ci

      - name: eslint
        run: npm run lint

      # 「豆でないもの」の一覧に語を足したとき、広すぎて本物の豆を巻き添えに
      # していないかを見る。豆が消えるのは図鑑から静かに減るだけで、
      # 見て気づけないので機械に見張らせる。
      - name: 豆の判定
        working-directory: .
        run: node tests/test_is_coffee.mjs

      # 記録は、失うと取り返せない唯一のデータ。ログイン・ログアウト・
      # 別アカウント・同期・削除が絡む出入りを、毎回ここで踏んでおく。
      - name: 記録の出入り
        working-directory: .
        run: node tests/test_store.mjs

      # 分からない値段を、分かったふりで出していないか。
      # 架空の100g単価が1つあると、安い順の先頭を占領する。
      - name: 値段の扱い
        working-directory: .
        run: node tests/test_price.mjs

      # 昔の豆番号で残っている記録の付け替え。人の記録を書き替えるので落とせない
      - name: 記録の付け替え
        working-directory: .
        run: node tests/test_relink.mjs

      # 公開と同じ条件（サブパスあり）で書き出せるところまで確かめる
      - name: 静的ビルド
        env:
          NEXT_PUBLIC_BASE_PATH: /bean-tracker
        run: npm run build
