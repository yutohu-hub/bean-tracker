name: ログインの設定を確かめる

# 「ログインできない」の原因は、キー・戻り先URL・テーブルの3か所に分かれる。
# 開発環境からは supabase.co に到達できないため、runner から実際に聞いて切り分ける。
# 公開鍵しか使わず、読むだけ。コミットもデプロイもしない。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: pip install httpx
      - name: 設定を確かめる
        run: python scripts/diag_auth.py
