name: Bean Tracker 巡回

on:
  schedule:
    # 442店を13分割して毎時1スライスずつ巡回する（1周およそ13時間）。
    # 一度に全店を叩くと Shopify の共有IP制限(429)でほぼ全滅するため、量を分けて回す。
    - cron: "0 * * * *"
  workflow_dispatch:         # 手動実行ボタン
    inputs:
      shard:
        # スライスは通常 run 番号から決まるので、手で走らせても狙った店には当たらない。
        # 店を足した直後は、その店の入っているスライスだけ先に回したい。
        # 空なら今までどおり run 番号から決める。
        description: "回すスライス（例: 3 / 空なら実行番号から自動）"
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    # GitHub Actions の共有IPは Shopify から 429 で弾かれるため、
    # 自宅/VPS の自己ホストランナーがあればそちらで巡回する。
    # リポジトリ変数 CRAWL_RUNNER に "self-hosted" を設定すると切り替わる。
    # 未設定の間は従来どおり ubuntu-latest で動く（設定ミスで巡回が止まらないように）。
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    # 442店を巡回しても通常は10分弱。応答しない店に引きずられて張り付かないよう上限を置く
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 新着・再入荷の判定には前回までの履歴(first_seen / last_status_change)が要る。
      # ただし state.db は毎回書き換わる 3MB のバイナリで、コミットするとリポジトリが
      # 日々肥大化する。派生キャッシュなので git ではなく Actions のキャッシュで持ち越す。
      - name: 巡回履歴DBを復元
        uses: actions/cache@v4
        with:
          path: data/state.db
          key: bean-tracker-state-${{ github.run_id }}
          restore-keys: |
            bean-tracker-state-

      # 自己ホスト機にツールキャッシュが無い場合もあるため、失敗しても止めない
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"

      - name: Python を確定
        id: py
        run: |
          if command -v python >/dev/null 2>&1; then
            echo "bin=python" >> "$GITHUB_OUTPUT"
          else
            echo "bin=python3" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存インストール
        run: |
          PY='${{ steps.py.outputs.bin }}'
          # 自己ホスト機のシステムPythonを汚さないよう、まず venv を試す
          if "$PY" -m venv .venv 2>/dev/null; then
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt
            echo "RUNPY=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          else
            "$PY" -m pip install -q --user -r requirements.txt || "$PY" -m pip install -q -r requirements.txt
            echo "RUNPY=$PY" >> "$GITHUB_ENV"
          fi

      - name: 巡回と差分検知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 端末へのプッシュ通知。未設定なら送信そのものを行わない（巡回は止まらない）
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          SHARDS: "13"
          PICK: ${{ inputs.shard }}
        run: |
          # run ごとにスライスをずらし、13回で全店を一周する。
          # 手動実行でスライスを指定したときはそれを使う（店を足した直後に、
          # その店の入っているスライスだけ先に回すため）。
          SLICE="$(( RUN_NUMBER % SHARDS ))"
          [ -n "$PICK" ] && SLICE="$(( PICK % SHARDS ))"
          "$RUNPY" main.py --shard "$SLICE/$SHARDS"

      - name: note の記事を取り込む（About に見出しを出す）
        run: |
          "$RUNPY" scripts/fetch_note.py
        continue-on-error: true

      - name: フロント用データに変換（巡回結果→図鑑オーバーレイ）
        run: |
          "$RUNPY" scripts/build_frontend_data.py

      - name: 結果をコミット（frontendの更新でPages再デプロイがトリガー）
        run: |
          git config user.name "bean-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # コミットするのはサイトが読む1ファイルだけ。
          # data/site.json と build/site/ の生成物は同じジョブ内で使い切る中間成果物なので追跡しない。
          # 座標のキャッシュも残す。これを捨てると毎回 Nominatim に問い合わせ直すことになり、
          # 相手の利用規約にも反する（同じ街を何度も引かないための蓄積）。
          FILES="frontend/components/data/live.generated.json frontend/components/data/note.generated.json config/citycoords.json"
          git add $FILES
          if git diff --cached --quiet; then
            echo "変わったものが無いので、コミットしない"
            exit 0
          fi
          git commit -m "crawl: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 走っている間に別の実行が main を進めていることがある。そのまま push すると
          # 弾かれ、4分かけて取った巡回結果を丸ごと捨てていた（実測: run #85）。
          # 最新の main を土台にして、この回の成果物を載せ直してから押す。
          # 生成物は data/state.db から作り直せるので、テキストとして混ぜる必要はない。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "他の実行が先に push していた（$i 回目）。取り込んで載せ直す。"
            MINE="$(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard origin/main
            git checkout "$MINE" -- $FILES
            git add $FILES
            if git diff --cached --quiet; then
              echo "取り込んだ内容と同じだったので、コミットしない"
              exit 0
            fi
            git commit -m "crawl: $(date -u +'%Y-%m-%d %H:%M UTC')"
          done
          echo "3回試しても push できなかった"
          exit 1
