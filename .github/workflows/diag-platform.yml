name: 取れていない店のEC種別を調べる

# 436軒のうち176軒は豆が1件も出ていない。原因が「対応していないEC」なのか
# 「ブロックされている」のか「URLが違う」のかを、実際に叩いて確かめる。
# 開発環境からは店に到達できないため、ネットワークのある runner で走らせる。
# 読むだけで、コミットもデプロイもしない。

on:
  workflow_dispatch:
    inputs:
      shard:
        description: '巡回と同じ分割指定（例 0/13）。空なら全店'
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: pip install httpx pyyaml
      - name: EC種別を調べる
        run: |
          if [ -n "${{ github.event.inputs.shard }}" ]; then
            python scripts/diag_platform.py --shard "${{ github.event.inputs.shard }}"
          else
            python scripts/diag_platform.py
          fi
