name: 候補の店から商品が取れるか確かめる

# 巡回対象に加える前の下見。config/candidates.yaml の店を実際に叩いて、
# 商品が取れるか・値段と内容量がそろうかを見る。
# 開発環境からは外に出られないので、ネットのある runner で確かめる
# （座標の照合を verify-positions.yml でやっているのと同じ理由）。

on:
  workflow_dispatch:
    inputs:
      file:
        description: "候補ファイル"
        default: "config/candidates.yaml"
      diagnose:
        description: "1店だけ詳しく調べる（URL。指定すると候補ファイルは見ない）"
        default: ""
      videos:
        description: "レシピに貼った動画が本人の回か確かめる（true）"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: pip install httpx pyyaml
      - name: 候補を叩く
        if: inputs.diagnose == '' && inputs.videos == ''
        run: python scripts/probe_roasters.py "${{ inputs.file }}"

      # 動画IDは1文字違うと別人の回が載る。目では気づけないので貼る前に照合する
      - name: レシピの動画を確かめる
        if: inputs.videos != ''
        run: python scripts/verify_videos.py

      # 取れない店について、何が足りないのかを応答から調べる
      - name: 1店を詳しく調べる
        if: inputs.diagnose != ''
        run: python scripts/diagnose_shop.py "${{ inputs.diagnose }}"
