name: 候補の店から商品が取れるか確かめる

# 巡回対象に加える前の下見。config/candidates.yaml の店を実際に叩いて、
# 商品が取れるか・値段と内容量がそろうかを見る。
# 開発環境からは外に出られないので、ネットのある runner で確かめる
# （座標の照合を verify-positions.yml でやっているのと同じ理由）。

on:
  workflow_dispatch:
    inputs:
      file:
        description: "候補ファイル"
        default: "config/candidates.yaml"
      diagnose:
        description: "1店だけ詳しく調べる（URL。指定すると候補ファイルは見ない）"
        default: ""
      videos:
        description: "レシピに貼った動画が本人の回か確かめる（true）"
        default: ""
      products:
        description: "名前では判断が付かない商品を店のページで確かめる（true）"
        default: ""
      types:
        description: "店が product_type に何と書いているかを集計する（店数。空なら全店）"
        default: ""
      markers:
        description: "「豆である証拠」がどれだけ揃うかを数える（店数。all で全店）"
        default: ""
      instagram:
        description: "Instagram のアカウント名を集めて config/instagram.yaml に貯める（店数。all で全店）"
        default: ""
      sheet:
        description: "情報シート（産地・精製・風味・内容量）の欠けを数える（店数。all で全店）"
        default: ""
      page:
        description: "商品ページのHTMLを読むと空欄が埋まるか試す（\"店数 商品数\" 例: 20 6）"
        default: ""
      notes:
        description: "風味がどれだけ取れて、どれだけ正しいかを測る（\"店数 ページ数\" 例: 40 3）"
        default: ""

# instagram モードだけ config/instagram.yaml を書き戻すので write が要る
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存インストール
        run: pip install httpx pyyaml
      - name: 候補を叩く
        if: inputs.diagnose == '' && inputs.videos == '' && inputs.products == '' && inputs.types == '' && inputs.markers == '' && inputs.instagram == '' && inputs.sheet == '' && inputs.page == '' && inputs.notes == ''
        run: python scripts/probe_roasters.py "${{ inputs.file }}"

      # 動画IDは1文字違うと別人の回が載る。目では気づけないので貼る前に照合する
      - name: レシピの動画を確かめる
        if: inputs.videos != ''
        run: python scripts/verify_videos.py

      # 名前だけでは豆か器具か分からない商品を、店の product_type で確かめる
      - name: 商品の種類を確かめる
        if: inputs.products != ''
        run: python scripts/check_products.py

      # 「店の申告を読む」判定が、本物の豆を落としていないかを実データで見る
      - name: 分類の集計
        if: inputs.types != ''
        run: python scripts/audit_product_types.py "${{ inputs.types == 'all' && '0' || inputs.types }}"

      # 「豆である証拠がある物だけ取る」に変えたとき、何が落ちるかを先に数える
      - name: 豆の証拠を数える
        if: inputs.markers != ''
        run: python scripts/audit_bean_markers.py "${{ inputs.markers == 'all' && '0' || inputs.markers }}"

      # 店のページから Instagram のアカウント名を集めて貯める。
      # 一度に全店を叩くと429で落ちるので、少しずつ回して足していく。
      - name: Instagramのアカウント名を集める
        if: inputs.instagram != ''
        run: python scripts/collect_instagram.py "${{ inputs.instagram == 'all' && '0' || inputs.instagram }}"

      - name: 集めた結果を残す
        if: inputs.instagram != ''
        run: |
          if [ -n "$(git status --porcelain config/instagram.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/instagram.yaml
            git commit -m "Instagram のアカウント名を集める（自動）"
            git push
          else
            echo "変更なし"
          fi

      # 情報シートの空欄が「店が書いていない」のか「取り方が悪い」のかを分ける
      - name: 情報シートの欠けを数える
        if: inputs.sheet != ''
        run: python scripts/audit_sheet.py "${{ inputs.sheet == 'all' && '0' || inputs.sheet }}"

      # products.json に無い情報が、商品ページのHTMLにあるかを試す
      - name: 商品ページを読んで試す
        if: inputs.page != ''
        run: python scripts/audit_product_page.py ${{ inputs.page }}

      # 風味の「量」と「質」を分けて測る。量だけ増やしても、別の豆の風味なら害になる
      - name: 風味の精度を測る
        if: inputs.notes != ''
        run: python scripts/audit_notes.py ${{ inputs.notes }}

      # 取れない店について、何が足りないのかを応答から調べる
      - name: 1店を詳しく調べる
        if: inputs.diagnose != ''
        run: python scripts/diagnose_shop.py "${{ inputs.diagnose }}"
