# 図鑑に名前はあるのに豆が1件も出ていない165店の 2/3。
#
# 1本にまとめて叩いたら15分の上限に当たった。閉じたドメインが混ざると
# 1店あたり最大 6経路×timeout かかるので、店数×待ち時間で上限を超える。
# 3つに割り、待ち時間を8秒に縮め、同時に12店叩く。
# 下見で知りたいのは「いまつながるか」だけなので、粘る意味はない。

settings:
  max_pages: 2
  timeout_sec: 8
  retries: 1
  concurrency: 12

