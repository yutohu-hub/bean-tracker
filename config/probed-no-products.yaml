# 叩いてみたが商品が取れなかった店。
#
# ここは巡回対象ではない。巡回するのは config/roasters.yaml だけ。
#
# ■ なぜ残すのか
#
# 候補ファイルを役目が終わるたびに消していたら、同じ店を何度も叩き直す
# ことになる。実際、豆香洞コーヒーは tokado-coffee.com で失敗したあと、
# 別の機会に同じドメインをもう一度並べていた。
#
# 取れなかった店をここに集めておけば、次に候補を作るときに突き合わせられる。
# 店の作りは変わるので、時間が経ってから叩き直す価値はある。そのときは
# このファイルをそのまま probe_roasters.py に渡せる形にしてある。
#
#   python scripts/probe_roasters.py config/probed-no-products.yaml
#
# 理由は測ったものだけ書いてある。分からないものは書いていない。

settings:
  max_pages: 2
  timeout_sec: 10
  retries: 1
  concurrency: 6

