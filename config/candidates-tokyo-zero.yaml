# 図鑑にあるのに豆が0件の東京の店。巡回一覧には入っているので、
# 毎時叩かれているのに商品が取れていない。理由を出すために叩き直す。
#
# 小川珈琲（会社案内のURLを登録していた）と同じ形が混ざっている可能性がある。
# 理由が「sitemapに商品ページが無い」なら店の作りの問題、
# 「robots.txt で断られている」なら方針どおり取らない、
# 404 や届かないなら URL が違う。分けないと打つ手が決まらない。

settings:
  max_pages: 4
  timeout_sec: 20
  retries: 2
  concurrency: 4

roasters:
  - name: "Switch Coffee"
    country: "JP"
    url: https://switchcoffeetokyo.com
