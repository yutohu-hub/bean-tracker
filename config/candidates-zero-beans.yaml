# 図鑑に名前はあるのに、豆が1件も出ていない店。
#
# 毎時の巡回一覧（config/roasters.yaml）には載っている。つまり叩いてはいる。
# それでも商品が取れていないので、図鑑では名前だけが並び、押しても何も無い。
#
# ■ 数えたこと（2026-08-30 01:08 UTC の巡回結果、豆 8,778件）
#
#   図鑑のロースター                      431店
#   そのうち豆が1件も無い                 168店（39%）
#     巡回一覧にも載っている（叩いている）  165店  ← ここに並べたもの
#     巡回一覧に無い（叩いていない）          3店
#
# 直す前に理由を分ける。sitemapが無いのか、robots.txtで断られているのか、
# 403で弾かれているのか、URLがそもそも売り場でないのか。
# まとめて1つの原因だと決めてかかると、直したのに数が動かない。
#
# 理由が揃ったら、いちばん多い形から手を付ける。

settings:
  max_pages: 2
  timeout_sec: 15
  retries: 1
  concurrency: 8

