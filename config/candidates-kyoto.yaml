# 京都のロースター候補。
#
# いま図鑑に入っている京都は8店（% Arabica / Circus / Kaikado / Kurasu /
# Okaffe / Unir / Walden Woods / Weekenders）。数の割に、京都の焙煎所は多い。
#
# ここでも店名からドメインを推測せず、1店ずつ検索して実際の売り場を確かめた。
#
# ■ 最後の2件は「新しい店」ではない
#
# 小川珈琲と Circus Coffee は既に図鑑に入っているのに、豆が0件だった
# （同じ京都の Kurasu は24件、Weekenders は17件）。調べると、登録してある
# URL は会社案内・店舗案内のページで、売り場は別のドメインにあった。
#
#   小川珈琲        oc-ogawa.co.jp      → 売り場は oc-shop.co.jp
#   Circus Coffee   circus-coffee.jp    → 売り場は circuscoffee.shop-pro.jp
#
# 豆香洞コーヒーと同じ形（.com を叩いて失敗していたが、売り場は
# shop-pro.jp にあった）。ここで取れるなら、新しい店を足すのと同じだけ
# 図鑑が厚くなる。取れることを確かめてから roasters.yaml の URL を直す。

settings:
  max_pages: 4
  timeout_sec: 20
  retries: 2
  concurrency: 4

roasters:
  - name: "WIFE&HUSBAND"
    country: "JP"
    url: https://wandh.buyshop.jp
    currency: JPY
  - name: "Sentido"
    country: "JP"
    url: https://sentidocoffe.theshop.jp
    currency: JPY
  - name: "DRIP & DROP COFFEE SUPPLY"
    country: "JP"
    url: https://drpdrp.com
    currency: JPY
  - name: "オオヤコーヒ焙煎所"
    country: "JP"
    url: https://ooyacoffee.stores.jp
    currency: JPY
  - name: "イノダコーヒ"
    country: "JP"
    url: https://store.inoda-coffee.co.jp
    currency: JPY
  - name: "カフェ・ヴェルディ"
    country: "JP"
    url: https://www.verdi.jp
    currency: JPY
  - name: "Coffee Base KANONDO"
    country: "JP"
    url: https://www.kanondo.coffee
    currency: JPY
  - name: "びーんず亭"
    country: "JP"
    url: https://www.beanstei.com
    currency: JPY
  - name: "ニシナ屋珈琲 京都"
    country: "JP"
    url: https://kyoto.nishinaya.com
    currency: JPY

  # ---- 既に図鑑にあるが豆0件。URLの直しが効くかを見る ----
  - name: "Ogawa Coffee（売り場）"
    country: "JP"
    url: https://oc-shop.co.jp
    currency: JPY
  - name: "Circus Coffee（売り場）"
    country: "JP"
    url: https://circuscoffee.shop-pro.jp
    currency: JPY
