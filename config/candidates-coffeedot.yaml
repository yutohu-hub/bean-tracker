# 教わった1店。URL は商品ページから店のトップを取ったもの。
#
#   https://coffeedot.stores.jp/items/66fe32bce7836e02b26c805f
#   → https://coffeedot.stores.jp
#
# STORES の店。Shopify の products.json も WooCommerce のAPIも無いので、
# sitemap + JSON-LD の経路で拾えるかどうかによる。同じ STORES の
# Lucent Coffee と BERTH COFFEE は取れているので、見込みはある。

settings:
  max_pages: 4
  timeout_sec: 20
  retries: 2
  concurrency: 2

roasters:
  - name: "COFFEE DOT"
    country: "JP"
    url: https://coffeedot.stores.jp
    currency: JPY
