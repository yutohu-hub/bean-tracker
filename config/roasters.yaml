# ============================================================
# 巡回対象ロースター一覧
# platform: auto  → Shopify → WooCommerce の順に自動判定
# ここに1ブロック追記するだけで巡回対象が増える
# ============================================================

settings:
  min_oos_hours: 12      # これ以上欠品していた商品が復活したら「再入荷」と判定
  max_pages: 4           # 1店舗あたり最大取得ページ数（250商品/ページ）
  # 429 は Shopify の共有IPあたりの「総リクエスト数」で効く。並列を上げても総量が増えるだけで
  # 逆効果になる（concurrency 10 × 442店を一度に流したら411店が429で失敗した）。
  # 1回の巡回は main.py --shard で 34店ほどに分割し、並列は実績のある 4 に戻す。
  timeout_sec: 15
  concurrency: 4

roasters:
