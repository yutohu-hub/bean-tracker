# メルボルンのロースター候補。
#
# 既に24店のオーストラリアの店が入っていて、そのうち17店はメルボルン。
# ここに並べるのは、まだ入っていない店。
#
# 名前と所在地は実在のものだが、商品が取れるかどうかは叩いてみないと分からない。
# 独自ECだったり、店頭のみだったり、サブスクだけの店もある。
# scripts/probe_roasters.py で確かめ、取れた店だけを config/roasters.yaml に写す。

settings:
  max_pages: 2
  timeout_sec: 20
  concurrency: 4

roasters:
