# 逃げ道を2つ足したあと、狙った9店が本当に取れるかを確かめる。
#
# 単体テストは偽の店で通っている。だが判定が正しいことと、実店舗で
# 効いていることは別の話で、robots.txt のときに1度それで外している
# （判定は通っていたのに、4経路が判定を素通りしていた）。
#
# 上6店は scan_pages を書いた店、下3店はトップの一覧から拾う店。

settings:
  max_pages: 4
  timeout_sec: 20
  retries: 2
  concurrency: 4

roasters:
