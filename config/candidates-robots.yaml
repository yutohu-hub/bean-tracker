# robots.txt を守る変更が、実際に巡回を止めているかを確かめるための3店。
#
# 監査（scripts/audit_robots.py, 455店）で「巡回する道を断っている」と出たのは
# この3店だけ。判定の単体テストは通っているが、判定が実際の取得経路に
# 効いているかは別の話なので、本物の巡回で叩いて確かめる。
#
#   期待する結果: 3店とも取れない。理由は「robots.txt で断られている」
#
# 「取れない」だけなら閉じたドメインでも同じ字が出る。理由の文言まで見ること。

settings:
  max_pages: 2
  timeout_sec: 10
  retries: 1
  concurrency: 3

roasters:
  - name: "Atmans Coffee"
    country: "ES"
    url: https://atmanscoffee.com
    currency: EUR
  - name: "Puchero"
    country: "ES"
    url: https://puchero.es
    currency: EUR
  - name: "Bear Pond Espresso"
    country: "JP"
    url: https://bear-pond.com
    currency: JPY
