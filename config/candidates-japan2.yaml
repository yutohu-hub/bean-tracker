# 日本のロースター候補（2巡目）。すでに70軒入っているので、ここは未収録の店。
#
# ■ 前回との違い
#
# 前回（config/candidates-japan.yaml）は店名からドメインを推測して並べ、
# 20店中14店を外した。Wavy Coffee も8つ推測して全部外し、結局は
# 教えてもらった shop.wavycoffee.jp が正解だった。
#
# 推測は当たらないうえに、外れたぶんだけ他所のサイトを叩くことになる。
# 今回は1店ずつ検索して、実際のオンラインショップのURLを確かめてから並べた。
# 実際、推測していたら外していたものが複数あった:
#
#   FINETIME       finetimecoffee.com  ではなく finetime.theshop.jp（BASE）
#   豆香洞コーヒー    tokado-coffee.com   ではなく tokado-coffee.shop-pro.jp
#                  （前回 .com で叩いて失敗していた店）
#   MOUNT COFFEE   mountcoffee.jp      ではなく mount-coffee.myshopify.com
#
# ■ それでも取れないことはある
#
# URLが正しくても商品一覧が取れるとは限らない。BASE・STORES・カラーミーは
# Shopify の products.json も WooCommerce のAPIも持たないので、
# sitemap + JSON-LD の経路（_fetch_generic）で拾えるかどうかによる。
# Möwe Coffee（BASE）は8豆取れているので、取れる店はある。
#
# 叩いて商品が取れた店だけを config/roasters.yaml に写す。

settings:
  max_pages: 4
  timeout_sec: 20
  retries: 2
  concurrency: 4

roasters:
  # ---- 関東 ----
  - name: "FINETIME COFFEE ROASTERS"
    country: "JP"
    url: https://finetime.theshop.jp
    currency: JPY
