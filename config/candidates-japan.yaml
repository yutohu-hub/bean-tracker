# 日本のロースター候補。
#
# すでに63軒入っている。ここに並べるのは、まだ入っていない店。
#
# 名前と所在地は実在の店だが、商品が取れるかは叩いてみないと分からない。
# 日本の小規模ロースターは BASE・STORES・Square・独自サイトを使うことが多く、
# その場合はドメインが正しくても商品一覧が取れない（対応しているのは
# Shopify の products.json / Atom と WooCommerce）。
#
# scripts/probe_roasters.py で確かめ、取れた店だけを config/roasters.yaml に写す。

settings:
  max_pages: 2
  # 候補には閉じたドメインが混ざる。下見では「今つながるか」が分かればよい
  timeout_sec: 10
  retries: 1
  concurrency: 6

